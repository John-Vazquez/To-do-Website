<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do Web App</title>
  <link rel="stylesheet" href="todostyles.css">
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <script defer src="todo.js"></script>
</head>
<body>
  <header>
    <h1>To-Do Web App</h1>
  </header>

  <div class="todo-container">

    <!-- Doing Right Now -->
    <div class="list-box">
      <h2>Doing Right Now</h2>
      <div class="task-box">
        <form onsubmit="addTask(LIST_IDS.doing,'doingInput','doingDate','doingList');return false;">
          <input id="doingInput" placeholder="Enter task">
          <input id="doingDate" placeholder="MM/DD">
          <button type="submit">Add</button>
        </form>
        <ul id="doingList"></ul>
      </div>
    </div>

    <!-- Must Do Today -->
    <div class="list-box">
      <h2>Must Do Today</h2>
      <div class="task-box">
        <form onsubmit="addTask(LIST_IDS.must,'mustInput','mustDate','mustList',3);return false;">
          <input id="mustInput" placeholder="Enter task">
          <input id="mustDate" placeholder="MM/DD">
          <button type="submit">Add</button>
        </form>
        <ul id="mustList"></ul>
      </div>
    </div>

    <!-- Expand/Collapse toggle -->
    <div class="view-toggle">
      <button id="toggleViewBtn">🔍 Expand View</button>
    </div>

    
    <!-- Other Important Lists -->
    <h2>Other Important Lists</h2>
    <div class="task-section">
      <div class="task-box">
