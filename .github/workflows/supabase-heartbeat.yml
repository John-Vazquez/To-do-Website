name: Supabase Heartbeat

on:
  schedule:
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run read-only database check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -eu
          : "${SUPABASE_URL:?Missing SUPABASE_URL}"
          : "${SUPABASE_ANON_KEY:?Missing SUPABASE_ANON_KEY}"

          result=$(curl --fail --silent --show-error --max-time 20 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/rpc/todo_heartbeat")

          if [ "$result" != true ]; then
            echo 'Unexpected Supabase heartbeat response.' >&2
            exit 1
          fi
          echo 'Supabase read-only database check passed.'
